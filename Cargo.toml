[package]
name = "solarion-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = [
    "system_font_discovery",
    "complex_script_segmentation",
] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Keep iteration builds playable without full optimization.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
